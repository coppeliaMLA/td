[package]
name = "td"
version = "0.1.0"
edition = "2024"
description = "A CLI tool for managing todo.txt files"
authors = ["Your Name"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
chrono = "0.4"
regex = "1"
lazy_static = "1.4"
dirs = "5"
anyhow = "1"
thiserror = "1"
colored = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
